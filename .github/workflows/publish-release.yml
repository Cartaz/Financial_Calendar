name: Publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          from config.constants import AppMeta
          print(AppMeta.VERSION)
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## [{version}]"
          if marker not in changelog:
              raise SystemExit(f"Missing CHANGELOG section for {version}")
          notes = changelog.split(marker, 1)[1]
          notes = notes.split("\n## [", 1)[0].strip()
          Path("/tmp/release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Financial Calendar $VERSION" \
            --notes-file /tmp/release-notes.md

      - name: Remove merged development branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state merged \
            --limit 100 \
            --json headRefName \
            --jq '.[].headRefName' \
          | sort -u \
          | while IFS= read -r branch; do
              [ -z "$branch" ] && continue
              [ "$branch" = "main" ] && continue
              echo "Deleting merged branch: $branch"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || true
            done

          for branch in ui/qml-dark-neumorphism-v3 ui/true-dark-neumorphism; do
            echo "Deleting legacy branch if present: $branch"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || true
          done

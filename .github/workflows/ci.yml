name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.3,<9" "ruff>=0.12,<1"

      - name: Installer syntax check
        run: bash -n install.sh

      - name: Python compile check
        run: python -m compileall -q main.py config core ui tests

      - name: Ruff
        run: ruff check --target-version py312 --select E4,E7,E9,F main.py config core ui tests

      - name: JavaScript syntax check
        run: |
          node --check ui/web/app.js
          node --check ui/web/navigation.js
          node --check ui/web/operations.js

      - name: Test suite
        run: python -m pytest tests -q

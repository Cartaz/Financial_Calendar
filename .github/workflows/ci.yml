name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.3,<9" "ruff>=0.12,<1"

      - name: Installer syntax check
        run: bash -n install.sh

      - name: Python compile check
        run: python -m compileall -q main.py config core ui tests

      - name: Ruff
        run: ruff check --target-version py312 --select E4,E7,E9,F main.py config core ui tests

      - name: JavaScript syntax check
        run: |
          node --check ui/web/app.js
          node --check ui/web/navigation.js
          node --check ui/web/operations.js

      - name: Test suite
        run: python -m pytest tests -q

  publish:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          from config.constants import AppMeta
          print(AppMeta.VERSION)
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## [{version}]"
          if marker not in changelog:
              raise SystemExit(f"Missing CHANGELOG section for {version}")
          notes = changelog.split(marker, 1)[1]
          notes = notes.split("\n## [", 1)[0].strip()
          Path("/tmp/release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Financial Calendar $VERSION" \
            --notes-file /tmp/release-notes.md

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Python compile check
        run: python -m compileall -q main.py config core ui_qml tests

      - name: Ruff
        run: ruff check main.py config core ui_qml tests

      - name: QML component lint
        run: |
          pyside6-qmllint -I qml \
            qml/RaisedSurface.qml \
            qml/InsetSurface.qml \
            qml/NeoButton.qml \
            qml/NeoCheckBox.qml \
            qml/NeoScrollBar.qml \
            qml/NeoTabButton.qml

      - name: Test suite
        run: pytest -q
